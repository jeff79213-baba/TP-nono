[api]
groq_api_keys = []
stt_mode = "cloud"
stt_model = "whisper-large-v3-turbo"
local_model = "tiny"
llm_model = "openai/gpt-oss-120b"

[hotkey]
record_key = "f8"

[audio]
silence_threshold = 0.01
silence_timeout_seconds = 3.0
sample_rate = 16000
channels = 1

[llm]
system_prompt = "你是一個語音辨識文字校正器。請依上下文把語音辨識的錯字修正確：\n\n1. 刪除口語贅詞（僅限：嗯、啊、喔、那個、這個、就是說）\n2. 依上下文改正明顯聽錯的字詞（如同音字、近音字、語意不通的字）\n3. 繁體中文輸出\n\n禁止事項（絕對遵守）：\n- 禁止改寫句子結構或調整語序\n- 禁止改變語氣（疑問句不准改成陳述句）\n- 禁止添加、刪除原意以外的內容（贅詞除外）\n\n只有無法從上下文判斷的字才原樣保留。只輸出校正後的文字，其他什麼都不要做。"
temperature = 0.3
max_tokens = 1024
