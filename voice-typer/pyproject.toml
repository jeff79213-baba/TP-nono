[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-typer"
version = "0.1.0"
description = "Typeless 開源平替版 - 本地端語音輸入工具"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "keyboard>=0.13",
    "pynput>=1.7",
    "httpx>=0.25",
    "pydantic>=2.0",
    "toml>=0.10",
    "Pillow>=10.0",
    "pyperclip>=1.8",
]

[project.scripts]
voice-typer = "src.main:main"
